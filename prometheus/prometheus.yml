global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Every Vault node is scraped directly (not through a load balancer) so standbys show up too.
  # Works without a token because the listener sets unauthenticated_metrics_access = true.
  # In production you would drop that and use: authorization: { credentials_file: /path/to/token }
  - job_name: vault
    metrics_path: /v1/sys/metrics
    params:
      format: [prometheus]
    static_configs:
      - targets: ["vault-1:8200", "vault-2:8200", "vault-3:8200"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: node

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
