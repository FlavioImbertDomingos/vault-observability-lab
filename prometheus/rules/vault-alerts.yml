# Alert rules based on HashiCorp Validated Designs, "Monitoring and observability".
# View them at http://localhost:9090/alerts
groups:
  - name: vault
    rules:
      - alert: VaultNodeSealed
        expr: vault_core_unsealed == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.node }} ({{ $labels.cluster }}) is sealed"

      - alert: VaultNodeDown
        expr: up{job="vault"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} is not answering /v1/sys/metrics"

      - alert: VaultNoActiveNode
        expr: sum by (cluster) (vault_core_active) < 1
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "No active Vault node in {{ $labels.cluster }}"

      - alert: VaultLeadershipLost
        expr: increase(vault_core_leadership_lost_count[10m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }} lost leadership in the last 10 minutes"

      - alert: VaultRaftFailureToleranceZero
        expr: max by (cluster) (vault_autopilot_failure_tolerance) < 1
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.cluster }} cannot lose another voter without losing quorum"

      - alert: VaultAuditFailure
        expr: increase(vault_audit_log_request_failure[5m]) > 0 or increase(vault_audit_log_response_failure[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "Audit device failures on {{ $labels.node }}. If all devices fail, Vault stops serving requests"

      - alert: VaultRootTokenCreated
        expr: increase(vault_token_create_root[5m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "A root token was created"

      - alert: VaultRequestLatencyHigh
        expr: vault_core_handle_request{quantile="0.99"} > 500
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "p99 request latency on {{ $labels.node }} above 500 ms"

      - alert: VaultGCPauseHigh
        expr: rate(vault_runtime_total_gc_pause_ns[2m]) * 60 / 1e9 > 2
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "GC pause on {{ $labels.node }} above 2 s per minute"

      - alert: VaultLeaseCountHigh
        expr: sum by (cluster) (vault_expire_num_leases) > 250000
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "More than 250k active leases in {{ $labels.cluster }}"

      - alert: VaultRateLimitViolations
        expr: sum by (cluster) (increase(vault_quota_rate_limit_violation[5m])) > 0
        labels: { severity: info }
        annotations:
          summary: "Clients hit a rate limit quota (HTTP 429)"
