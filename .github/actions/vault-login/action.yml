name: Vault login (GitHub OIDC)
description: >
  Exchange the job's GitHub OIDC token for a short-lived Vault token.
  No Vault credential is stored in GitHub. Needs "permissions: id-token: write".
inputs:
  role:
    description: Vault JWT role (terraform-plan or terraform-apply)
    required: true
  mount:
    description: Path of the JWT auth method in Vault
    default: jwt-github
runs:
  using: composite
  steps:
    - name: Log in to Vault as ${{ inputs.role }}
      shell: bash
      env:
        ROLE: ${{ inputs.role }}
        MOUNT: ${{ inputs.mount }}
      run: |
        set -euo pipefail
        # 1. GitHub signs a token describing this job (repo, branch, environment, actor)
        JWT=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=vault" | jq -r .value)
        # 2. Vault checks the signature and the role's bound claims, then issues a token
        RESP=$(curl -sS -X POST --data "{\"role\":\"$ROLE\",\"jwt\":\"$JWT\"}" \
          "$VAULT_ADDR/v1/auth/$MOUNT/login")
        TOKEN=$(echo "$RESP" | jq -r '.auth.client_token // empty')
        if [ -z "$TOKEN" ]; then
          echo "::error::Vault refused the login for role $ROLE: $(echo "$RESP" | jq -c .errors)"
          exit 1
        fi
        echo "::add-mask::$TOKEN"
        echo "VAULT_TOKEN=$TOKEN" >> "$GITHUB_ENV"
        echo "Logged in to Vault as role $ROLE, policies: $(echo "$RESP" | jq -c .auth.policies), ttl $(echo "$RESP" | jq .auth.lease_duration)s"
