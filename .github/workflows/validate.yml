name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose file
        run: docker compose config -q

      - name: Shell scripts
        run: |
          bash -n lab.sh
          for f in vault/scripts/*.sh wazuh/gen-certs.sh; do sh -n "$f"; done

      - name: Prometheus config and rules
        run: |
          docker run --rm -v "$PWD/prometheus:/p" --entrypoint promtool \
            quay.io/prometheus/prometheus:v3.16.0 check rules /p/rules/vault-alerts.yml

      - name: Wazuh rules are valid XML
        run: |
          python3 - <<'PY'
          import xml.dom.minidom
          xml.dom.minidom.parseString("<root>" + open("wazuh/rules/vault_rules.xml").read().split("-->", 1)[1] + "</root>")
          PY

      - name: Ansible playbook
        run: |
          pip install --quiet ansible-core
          cd ansible/vault-rolling-upgrade
          ansible-playbook -i inventory.example.ini upgrade.yml --syntax-check

      - name: Terraform
        run: |
          docker run --rm -v "$PWD/terraform/multicloud:/work" -w /work hashicorp/terraform:1.17 fmt -check -recursive
          docker run --rm -v "$PWD/terraform/multicloud:/work" -w /work --entrypoint sh hashicorp/terraform:1.17 \
            -c "terraform init -backend=false -input=false >/dev/null && terraform validate"

      - name: Generated dashboards are up to date
        run: |
          python3 grafana/build_dashboard.py
          python3 wazuh/build_dashboard.py
          git diff --exit-code grafana/dashboards wazuh/*.ndjson
